# Cloudflare Pages 用の設定。
# Astro ビルド後の dist/ を配信します。
#
# Git 連携デプロイ: Dashboard の Deploy command → bun run pages:deploy（wrangler deploy は使わない）。
# Deploy command で wrangler を使う場合は Dashboard の Environment variables に
# CLOUDFLARE_API_TOKEN（必須）と CLOUDFLARE_ACCOUNT_ID（推奨）を設定すること。
# 手動デプロイ: bun run build && bun run pages:deploy
# Dashboard → Workers & Pages のプロジェクト名と完全一致させる（例: babytato.link の可能性あり）
name = "babytato-link"
compatibility_date = "2026-09-21"
pages_build_output_dir = "./dist"

# Dashboard 右サイドバーの Account ID（CI 非対話では必須級）。CLOUDFLARE_ACCOUNT_ID でも可。
# wrangler pages deploy に --account-id フラグはない。
account_id = "4d3287a19985d6acc5d19bacf2178d24"

# ADMIN_* / SESSION_SECRET / GITHUB_TOKEN は Dashboard の Environment variables に設定。
# wrangler.toml や git にシークレットを書かないこと。
# セットアップ手順: docs/SETUP-AUTH.md
