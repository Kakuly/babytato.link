# Cloudflare Pages 用の設定。
# Astro ビルド後の dist/ を配信します。
#
# Worker Builds: Deploy command = true（ビルドのみ）。本番反映は GitHub Actions → wrangler pages deploy。
# 手動デプロイ: bun run build && bun run pages:deploy
# Dashboard → Workers & Pages のプロジェクト名と完全一致させる（例: babytato.link の可能性あり）
name = "babytato-link"
compatibility_date = "2026-09-21"
pages_build_output_dir = "./dist"

# CI 非対話デプロイ: Dashboard → Environment variables に CLOUDFLARE_ACCOUNT_ID を設定（必須級）。
# Pages プロジェクトの wrangler.toml では account_id は使えない（設定検証エラーになる）。
# wrangler pages deploy に --account-id フラグもない。

# ADMIN_* / SESSION_SECRET / GITHUB_TOKEN / RESEND_* / CONTACT_* は Dashboard の Environment variables に設定。
# wrangler.toml や git にシークレットを書かないこと。
# セットアップ手順: docs/SETUP-AUTH.md
# お問い合わせ: RESEND_API_KEY + RESEND_FROM + CONTACT_TO_EMAIL（優先）
#               または CONTACT_WEBHOOK_URL（Discord / Slack Incoming Webhook）
#
# News 本文は D1（即時公開）。links / discography は GitHub。画像は R2 MEDIA（無ければ GitHub public/news/）。
#
# D1 / R2 は未作成のまま wrangler.toml に書くと Pages の Function publish が失敗する
# （存在しない database_id / bucket を検証される）。既定ではコメントアウト。
#
# 本番 News（必須・手動チェックリスト）:
#   1. Dashboard → Storage & databases → D1 SQL database → Create database
#      → Name: babytato-news → Create
#   2. Workers & Pages → babytato-link → Settings → Bindings → Add → D1 database
#      → Variable name: DB → D1 database: babytato-news → Save
#      → Production と Preview の両方に付ける
#   3. Deployments → 最新 → Retry deployment（Bindings 反映）
#   4. 初回 /api/news でスキーマ作成 + src/content/news シード
#   詳細: docs/SETUP-AUTH.md §4b
#   任意: `npx wrangler d1 create babytato-news` の database_id を下記に貼ってアンコメント
# ローカル: `bun run pages:dev` が `--d1=DB` で miniflare ローカル D1 を立てる。
#
# R2 有効化: npx wrangler r2 bucket create babytato-news-media
#            → 下記 [[r2_buckets]] をアンコメント → Dashboard で MEDIA を接続

[[d1_databases]]
binding = "DB"
database_name = "babytato-news"
database_id = "d06c5baa-9f14-4ed1-92dd-8068a9305eae"
migrations_dir = "migrations"

# [[r2_buckets]]
# binding = "MEDIA"
# bucket_name = "babytato-news-media"
